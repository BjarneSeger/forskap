name: Go binding

# Guards the checked-in Go binding (clients/go) against drift from the varlink
# interface it is generated from. Fails if someone edits the .varlink, or bumps
# the forskap-api version version.go carries, without regenerating, or
# hand-edits a generated file.

on:
  push:
    paths:
      - "forskap-api/varlink/**"
      - "forskap-api/Cargo.toml"
      - "clients/go/**"
      - ".github/workflows/go-binding.yml"
  pull_request:
    paths:
      - "forskap-api/varlink/**"
      - "forskap-api/Cargo.toml"
      - "clients/go/**"
      - ".github/workflows/go-binding.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Regenerate, build and vet
        working-directory: clients/go
        run: |
          go generate ./...
          go build ./...
          go vet ./...

      - name: Fail if the committed binding is stale
        run: git diff --exit-code
