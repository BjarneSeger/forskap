name: Release

# Tags publish a release. Pushes to main (and manual runs) do a snapshot
# build instead: nothing is published, but the build is verified and the
# kache store is saved — Actions caches are only visible to the ref that
# saved them and to the default branch, so a tag can never reuse another
# tag's cache.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # Pinned: the kache version is part of the cache key and of its only
      # restore prefix, so a floating "latest" would cold-start the cache.
      - name: Set up kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: v0.28.1
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # GoReleaser's ignore_tags globs only cover the nearest-tag lookup: a
      # tag on HEAD itself is compared literally, and main is often tagged
      # `clients/go/v*` (the Go binding).
      - name: Pick the release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(git describe --tags --abbrev=0 --match 'v*')
          fi
          echo "GORELEASER_CURRENT_TAG=$tag" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ github.ref_type == 'tag' && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags only: point the Homebrew formula (Formula/forskap.rb) at the release
  # just published and commit that to main. A push made with GITHUB_TOKEN
  # starts no workflow, hence the explicit formula test below.
  bump-formula:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Point the formula at the tag
        run: bash .github/scripts/bump-formula.sh "$GITHUB_REF_NAME"

      - name: Commit to main
        id: push
        run: |
          if ! git diff --quiet -- Formula/forskap.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: Bump formula to $GITHUB_REF_NAME" -- Formula/forskap.rb
            # main may have moved since the checkout.
            for attempt in 1 2 3 4 5; do
              git push origin HEAD:main && break
              [ "$attempt" -lt 5 ] || exit 1
              sleep $((attempt * 5))
              git pull --rebase origin main
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  brew:
    needs: bump-formula
    permissions:
      contents: read
    uses: ./.github/workflows/brew.yml
    with:
      ref: ${{ needs.bump-formula.outputs.sha }}
