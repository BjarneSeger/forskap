name: Release

# Tags publish a release. Pushes to main (and manual runs) do a snapshot
# build instead: nothing is published, but the build is verified and the
# kache store is saved — Actions caches are only visible to the ref that
# saved them and to the default branch, so a tag can never reuse another
# tag's cache.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # GoReleaser cross-compiles for Linux only: the daemon links
  # Security.framework, which needs Apple's SDK. The macOS archive is built
  # here, for snapshots as well, so a macOS-only break shows before a tag,
  # and the release job publishes it with the Linux ones.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build
        env:
          # The oldest macOS on Apple silicon, and rustc's minimum for the
          # target; set so the C code the cc crate compiles gets the same
          # floor, not the runner's. Same in brew.yml.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked --target aarch64-apple-darwin --package forskapd --package forskap-cli --bin forskapd --bin forskap

      # GoReleaser publishes it under its own version (.goreleaser.yaml,
      # extra_files), which is the tag's; a snapshot's differs.
      - name: Pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          fi
          bash .github/scripts/package-release.sh "$version" darwin arm64 target/aarch64-apple-darwin/release dist-darwin

      - uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64
          path: dist-darwin/
          if-no-files-found: error

  release:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # Pinned: the kache version is part of the cache key and of its only
      # restore prefix, so a floating "latest" would cold-start the cache.
      - name: Set up kache
        uses: kunobi-ninja/kache-action@v1
        with:
          version: v0.28.1
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # GoReleaser's ignore_tags globs only cover the nearest-tag lookup: a
      # tag on HEAD itself is compared literally, and main is often tagged
      # `clients/go/v*` (the Go binding).
      - name: Pick the release tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag=$(git describe --tags --abbrev=0 --match 'v*')
          fi
          echo "GORELEASER_CURRENT_TAG=$tag" >> "$GITHUB_ENV"

      # Where .goreleaser.yaml's extra_files look for it (gitignored).
      - name: Fetch the macOS archive
        uses: actions/download-artifact@v8
        with:
          name: darwin-arm64
          path: dist-darwin

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ github.ref_type == 'tag' && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # What a tag publishes, or a snapshot would.
      - name: List the checksums
        run: cat dist/*_checksums.txt

  # Tags only: render the Homebrew formula (Formula/forskap.rb) for the
  # release just published, from its checksums file, and commit that to main.
  # A push made with GITHUB_TOKEN starts no workflow, hence the explicit
  # formula test below.
  bump-formula:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Point the formula at the tag
        run: bash .github/scripts/bump-formula.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit to main
        id: push
        run: |
          if ! git diff --quiet -- Formula/forskap.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: Bump formula to $GITHUB_REF_NAME" -- Formula/forskap.rb
            # main may have moved since the checkout.
            for attempt in 1 2 3 4 5; do
              git push origin HEAD:main && break
              [ "$attempt" -lt 5 ] || exit 1
              sleep $((attempt * 5))
              git pull --rebase origin main
            done
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  brew:
    needs: bump-formula
    permissions:
      contents: read
    uses: ./.github/workflows/brew.yml
    with:
      ref: ${{ needs.bump-formula.outputs.sha }}
