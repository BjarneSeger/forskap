name: Homebrew

# Installs the formula of this repository's tap with Homebrew, runs
# `brew test` and, on macOS, the daemon as a launchd service. Two modes:
#
# - `checkout` (pushes and pull requests): the checkout is built with cargo,
#   packed like a release archive and installed through the formula the
#   release workflow would render for it, so a change is tried on macOS
#   before it is released.
# - `stable` (manual runs, and the release workflow after it rendered the
#   formula for a tag): the formula as committed, downloading the release it
#   names, the way a user gets it.
on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - ".github/workflows/brew.yml"
      # Pack the archive and render the formula that checkout mode installs.
      - ".github/scripts/package-release.sh"
      - ".github/scripts/render-formula.sh"
      # Gives the Linux release archives the layout the formula expects.
      - ".goreleaser.yaml"
      # What decides whether the workspace builds on macOS at all: a feature
      # that only a Linux-only dependency enables goes unnoticed elsewhere.
      - "Cargo.toml"
      - "Cargo.lock"
      - "*/Cargo.toml"
      # Writes the completion files the formula installs.
      - "forskap-cli/build.rs"
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/brew.yml"
      - ".github/scripts/package-release.sh"
      - ".github/scripts/render-formula.sh"
      - ".goreleaser.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*/Cargo.toml"
      - "forskap-cli/build.rs"
  workflow_dispatch:
    inputs:
      mode:
        description: What the formula installs.
        type: choice
        options:
          - stable
          - checkout
        default: stable
  workflow_call:
    inputs:
      ref:
        description: Commit or branch holding the formula to test.
        type: string
        required: false
      mode:
        description: "What the formula installs: stable or checkout."
        type: string
        default: stable

permissions:
  contents: read

concurrency:
  group: brew-${{ github.ref }}
  cancel-in-progress: true

env:
  MODE: ${{ inputs.mode || 'checkout' }}
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  formula:
    name: ${{ matrix.os }} (${{ inputs.mode || 'checkout' }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest # arm64
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Put brew on the PATH
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      # The checkout itself is the tap, as `brew tap bjarneseger/forskap <url>`
      # makes it for a user.
      - name: Tap the checkout
        run: |
          taps="$(brew --repository)/Library/Taps/bjarneseger"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-forskap"
          brew info bjarneseger/forskap/forskap

      # Checkout mode never downloads the release the committed formula
      # names; this still checks its url and sha256.
      - name: Fetch the release the formula names
        if: env.MODE == 'checkout'
        run: brew fetch --build-from-source bjarneseger/forskap/forskap

      - name: Install Rust
        if: env.MODE == 'checkout'
        uses: dtolnay/rust-toolchain@stable

      # The build and the archive of a release: release.yml's macOS job
      # packs with the same script, GoReleaser gives the Linux archives the
      # same layout. The archive is named after the workspace version, which
      # the formula's test compares with `forskap --version`.
      - name: Build and pack the checkout
        if: env.MODE == 'checkout'
        env:
          # As in release.yml.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --package forskapd --package forskap-cli --bin forskapd --bin forskap
          case "$RUNNER_OS/$RUNNER_ARCH" in
            macOS/ARM64) platform="darwin arm64" ;;
            Linux/X64) platform="linux amd64" ;;
            Linux/ARM64) platform="linux arm64" ;;
            *) echo "no release archive for $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          # shellcheck disable=SC2086 # $platform is two arguments
          archive="$(bash .github/scripts/package-release.sh "$version" $platform target/release "$RUNNER_TEMP/dist")"
          tar -tvzf "$archive"
          cd "$RUNNER_TEMP/dist"
          (sha256sum -- *.tar.gz 2>/dev/null || shasum -a 256 -- *.tar.gz) > checksums.txt
          cat checksums.txt
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Deployment target and signature of what the archive carries: the
      # linker signs ad hoc, nothing notarizes it.
      - name: Inspect the macOS binaries
        if: env.MODE == 'checkout' && runner.os == 'macOS'
        run: |
          for bin in forskapd forskap; do
            codesign --display --verbose=2 "target/release/$bin"
            vtool -show-build "target/release/$bin" | tee "$RUNNER_TEMP/build-version"
            grep "minos 11.0" "$RUNNER_TEMP/build-version"
          done

      # Only the tap in this job changes: the formula the release workflow
      # renders for a tag, here for the one archive packed above.
      - name: Render the formula for the archive
        if: env.MODE == 'checkout'
        run: |
          bash .github/scripts/render-formula.sh "$VERSION" "file://$RUNNER_TEMP/dist" "$RUNNER_TEMP/dist/checksums.txt" > Formula/forskap.rb
          sed -n '/^  stable do$/,/^  end$/p' Formula/forskap.rb

      # The formula alone: `brew style <tap>` would also lint every workflow
      # of this repository.
      - name: Style and audit
        run: |
          brew style bjarneseger/forskap/forskap
          brew audit --strict bjarneseger/forskap/forskap

      - name: Install
        run: brew install bjarneseger/forskap/forskap

      - name: Test
        run: brew test bjarneseger/forskap/forskap

      - name: Check what was installed
        run: |
          prefix="$(brew --prefix forskap)"
          test -x "$prefix/bin/forskapd"
          test -x "$prefix/bin/forskap"
          test ! -e "$prefix/bin/gen-config-template"
          test -s "$prefix/etc/bash_completion.d/forskap"
          test -s "$prefix/share/zsh/site-functions/_forskap"
          test -s "$prefix/share/fish/vendor_completions.d/forskap.fish"
          forskap --version
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --verify --verbose "$prefix/bin/forskapd" "$prefix/bin/forskap"
            xattr -l "$prefix/bin/forskapd" "$prefix/bin/forskap"
          fi

      # A dry run needs no account and must leave nothing behind; the CLI
      # drives it, a write included. The release a stable run builds may
      # predate the daemon's flags.
      - name: Try the daemon's flags and a dry run
        if: env.MODE == 'checkout'
        run: |
          forskapd --version
          if forskapd --no-such-flag; then exit 1; else test $? -eq 2; fi
          forskapd --dry-run > "$RUNNER_TEMP/dry-run.addr" &
          pid=$!
          for _ in $(seq 1 300); do
            [ -s "$RUNNER_TEMP/dry-run.addr" ] && break
            sleep 0.1
          done
          FORSKAPD_SOCKET="$(head -n1 "$RUNNER_TEMP/dry-run.addr")"
          export FORSKAPD_SOCKET
          echo "dry run at $FORSKAPD_SOCKET"
          case "$FORSKAPD_SOCKET" in unix:/*/forskapd-dry-run.*/forskapd.socket) ;; *) exit 1 ;; esac
          dir="$(dirname "${FORSKAPD_SOCKET#unix:}")"
          forskap auth status | grep -F "dry-run.invalid"
          forskap issue list
          test "$(forskap issue list | grep -c '^#')" -eq 6
          forskap issue close 12 -p acme/backend/api
          test "$(forskap issue list | grep -c '^#')" -eq 5
          kill "$pid"
          wait "$pid"
          test ! -e "$dir"

      # All of it is the user's who starts it: the unit, the log, and the
      # socket in a directory of theirs. The release a stable run installs
      # may still bind /tmp.
      - name: Run the daemon as a service
        if: runner.os == 'macOS'
        run: |
          brew services start bjarneseger/forskap/forskap
          for _ in $(seq 1 60); do
            forskap queue list --output json > /dev/null 2>&1 && break
            sleep 1
          done
          brew services info forskap
          forskap queue list --output json
          forskap auth status || true
          # homebrew.mxcl.forskap or sh.brew.forskap, by Homebrew's version.
          set -- "$HOME"/Library/LaunchAgents/*.forskap.plist
          test -f "$1"
          test -s "$HOME/Library/Logs/forskapd.log"
          socket="$HOME/Library/Application Support/forskapd/forskapd.socket"
          if [ "$MODE" = checkout ]; then
            test -S "$socket"
            test "$(stat -f %Lp "$socket")" = 600
            test ! -e /tmp/forskapd.socket
          fi
          brew services stop forskap
          if [ "$MODE" = checkout ]; then
            for _ in $(seq 1 10); do
              [ -e "$socket" ] || break
              sleep 1
            done
            test ! -e "$socket"
          fi

      - name: Service log
        if: always() && runner.os == 'macOS'
        run: cat "$HOME/Library/Logs/forskapd.log" || true
