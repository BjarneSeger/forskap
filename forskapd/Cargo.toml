[package]
name = "forskapd"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "forskapd"

[dependencies]
gitlab.workspace = true
# Not used in the code: the `gitlab` crate builds its own reqwest client, and
# cargo's feature unification lets the `gzip` asked for here reach it. With it
# compiled in, that client sends `Accept-Encoding: gzip` and decodes the answer
# (a page of 100 projects is 121 kB plain, about 7 kB gzipped). A test in
# `src/gitlab.rs` fails if a dependency bump splits the two reqwest versions.
reqwest.workspace = true
notify.workspace = true
fjall.workspace = true
xxhash-rust.workspace = true
varlink.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
http.workspace = true
async-trait.workspace = true
forskap-api.workspace = true
chrono.workspace = true
confique.workspace = true
clap.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, features = ["OSX_10_15"] }
security-framework-sys = { workspace = true, features = ["OSX_10_15"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
oo7 = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio", "html_reports"] }
proptest.workspace = true
tempfile = "3"
url = "2"
bytes = "1"
# Already in the tree through reqwest's `gzip`; a test encodes with it.
flate2 = "1"
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "handlers"
harness = false
