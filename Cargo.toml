[workspace]
resolver = "3"
members = ["forskap-api","forskapd","forskap-cli"]

[workspace.package]
edition = "2024"
version = "0.12.0"
license = "GPL-3.0-only"

[workspace.dependencies]
# Shared error / serde / async core
# `rt-multi-thread` is what the daemon's `#[tokio::main]` runs on. On Linux
# zbus enables it as well; on macOS nothing else does.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "time", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1"
# The fields serde would drop: an argument the daemon doesn't know is refused.
serde_ignored = "0.1"
serde-saphyr = { version = "1.3", default-features = false, features = ["serialize"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

# External APIs
gitlab = "0.1904"
forskap-api = { path = "./forskap-api", version = "0.32.0" }
varlink = { version = "13.0", features = ["tokio"] }
varlink_generator = "13.0"
# forskap-api's build script edits the generator's output with these; all
# three come with varlink_generator already.
varlink_parser = "6.0"
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
dirs = "7"
http = "1"
# No code names this: it only switches `gzip` on for the client the `gitlab`
# crate builds, so it has to stay on the reqwest line that crate uses.
reqwest = { version = "0.13.1", default-features = false, features = ["gzip"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Local storage
notify = "8"
fjall = "3.1"
# The hash fjall already brings; its output is fixed by the XXH3 spec.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
security-framework = "3.7"
security-framework-sys = "2.17"
oo7 = { version = "0.6", features = ["tracing"] }

# Testing
proptest = "1"

# CLI
clap = { version = "4.6", features = ["derive", "wrap_help"] }
inquire = "0.9"
# Already in the tree through clap.
anstyle = "1"
confique = { version = "0.4.0", default-features = false, features = ["toml"] }
# `unstable-dynamic` (the completion engine behind `COMPLETE=<shell> forskap`)
# carries no semver promise, so this is pinned exactly: bump it deliberately
# and re-check `forskap-cli/src/complete.rs` and `build.rs` when doing so.
clap_complete = { version = "=4.6.11", features = ["unstable-dynamic"] }

# Desktop integration (GNOME Shell search provider / KRunner plugin)
zbus = { version = "5", default-features = false, features = ["tokio"] }
