id          = "thehoster/gitlab-trackr"
name        = "GitLab Trackr"
version     = "0.2.0"
plugin_api  = 24 # argument-array form of noctalia.runAsync
author      = "thehoster"
license     = "GPL-3.0-only"
icon        = "brand-gitlab"
description = "Search GitLab issues, merge requests, projects and groups through gitlab-trackrd; frequently opened items rank first."
tags        = ["gitlab", "launcher", "search"]
dependencies = ["tt"]

[[setting]]
key             = "tt_path"
type            = "file"
label_key       = "settings.tt_path.label"
description_key = "settings.tt_path.description"
default         = "tt"

[[setting]]
key             = "limit"
type            = "int"
label_key       = "settings.limit.label"
description_key = "settings.limit.description"
default         = 15
min             = 1
max             = 50

[[launcher_provider]]
id                       = "search"
entry                    = "launcher.luau"
prefix                   = "gl"
glyph                    = "brand-gitlab"
debounce_ms              = 150
include_in_global_search = false

  # Filter buttons (shown when `shell.launcher.categories = true`); a result's
  # `category` must equal the label verbatim.
  [[launcher_provider.category]]
  label = "Issues"
  glyph = "circle-dot"

  [[launcher_provider.category]]
  label = "Merge requests"
  glyph = "git-pull-request"

  [[launcher_provider.category]]
  label = "Projects"
  glyph = "folder"

  [[launcher_provider.category]]
  label = "Groups"
  glyph = "users"
