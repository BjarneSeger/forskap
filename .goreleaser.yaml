version: 2

project_name: gitlab-trackr

before:
  hooks:
    # Render the annotated default config shipped as the package-provided
    # layer at /usr/share/gitlab-trackrd/config.toml (see nfpms contents).
    - sh -c "cargo run --quiet --package gitlab-trackrd --bin gen-config-template > gitlab-trackrd/packaging/config.toml"

builds:
  - id: gitlab-trackrd
    binary: gitlab-trackrd
    builder: rust
    targets:
      - "x86_64-unknown-linux-gnu"
      - "aarch64-unknown-linux-gnu"
    command: zigbuild
    flags:
      - --release
      - --package=gitlab-trackrd
  - id: tt-cli
    binary: tt
    builder: rust
    targets:
      - "x86_64-unknown-linux-gnu"
      - "aarch64-unknown-linux-gnu"
    command: zigbuild
    flags:
      - --release
      - --package=tt-cli

archives:
  - id: gitlab-trackrd
    ids:
      - gitlab-trackrd
      - tt-cli
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - ids:
      - tt-cli
      - gitlab-trackrd
    package_name: gitlab-trackr-utils
    maintainer: Bjarne Seger <bjarneseger@thehoster.org>
    description: GitLab time-tracking utils
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    contents:
      - src: tt-cli/completions/tt.bash
        dst: /usr/share/bash-completion/completions/tt
      - src: tt-cli/completions/_tt
        dst: /usr/share/zsh/site-functions/_tt
      - src: tt-cli/completions/tt.fish
        dst: /usr/share/fish/vendor_completions.d/tt.fish
      - src: tt-cli/completions/tt.yaml
        dst: /usr/share/carapace/specs/tt.yaml
      - src: gitlab-trackrd/packaging/gitlab-trackrd.service
        dst: /usr/lib/systemd/user/gitlab-trackrd.service
        file_info:
          mode: 0644
      - src: gitlab-trackrd/packaging/gitlab-trackrd.socket
        dst: /usr/lib/systemd/user/gitlab-trackrd.socket
        file_info:
          mode: 0644
      - src: gitlab-trackrd/packaging/config.toml
        dst: /usr/share/gitlab-trackrd/config.toml
        file_info:
          mode: 0644
      - src: tt-cli/packaging/gnome-shell/search-providers/org.thehoster.gitlab.trackr.search-provider.ini
        dst: /usr/share/gnome-shell/search-providers/org.thehoster.gitlab.trackr.search-provider.ini
        file_info:
          mode: 0644
      - src: tt-cli/packaging/applications/org.thehoster.gitlab.trackr.desktop
        dst: /usr/share/applications/org.thehoster.gitlab.trackr.desktop
        file_info:
          mode: 0644
      - src: tt-cli/packaging/dbus-1/services/org.thehoster.gitlab.trackr.SearchProvider.service
        dst: /usr/share/dbus-1/services/org.thehoster.gitlab.trackr.SearchProvider.service
        file_info:
          mode: 0644
      - src: tt-cli/packaging/krunner/dbusplugins/org.thehoster.gitlab.trackr.desktop
        dst: /usr/share/krunner/dbusplugins/org.thehoster.gitlab.trackr.desktop
        file_info:
          mode: 0644
