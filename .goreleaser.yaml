version: 2

project_name: forskap

before:
  hooks:
    # Render the annotated default config shipped as the package-provided
    # layer at /usr/share/forskapd/config.toml (see nfpms contents). Built
    # like the x86_64 forskapd binary below so that build reuses the work.
    - sh -c "cargo zigbuild --release --target x86_64-unknown-linux-gnu --package forskapd --bin gen-config-template && target/x86_64-unknown-linux-gnu/release/gen-config-template > forskapd/packaging/config.toml"

builds:
  - id: forskapd
    binary: forskapd
    builder: rust
    targets:
      - "x86_64-unknown-linux-gnu"
      - "aarch64-unknown-linux-gnu"
    command: zigbuild
    flags:
      - --release
      - --package=forskapd
  - id: forskap-cli
    binary: forskap
    builder: rust
    targets:
      - "x86_64-unknown-linux-gnu"
      - "aarch64-unknown-linux-gnu"
    command: zigbuild
    flags:
      - --release
      - --package=forskap-cli

archives:
  - id: forskapd
    ids:
      - forskapd
      - forskap-cli
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - ids:
      - forskap-cli
      - forskapd
    package_name: forskap-utils
    maintainer: Bjarne Seger <bjarneseger@thehoster.org>
    description: GitLab time-tracking utils
    formats:
      - deb
      - rpm
      - archlinux
    bindir: /usr/bin
    replaces:
      - gitlab-trackr-utils
    conflicts:
      - gitlab-trackr-utils
    provides:
      - gitlab-trackr-utils
    contents:
      # Installed shell hooks call `tt tick`.
      - src: /usr/bin/forskap
        dst: /usr/bin/tt
        type: symlink
      - src: forskap-cli/completions/forskap.bash
        dst: /usr/share/bash-completion/completions/forskap
      - src: forskap-cli/completions/_forskap
        dst: /usr/share/zsh/site-functions/_forskap
      - src: forskap-cli/completions/forskap.fish
        dst: /usr/share/fish/vendor_completions.d/forskap.fish
      - src: forskap-cli/completions/forskap.yaml
        dst: /usr/share/carapace/specs/forskap.yaml
      - src: forskapd/packaging/forskapd.service
        dst: /usr/lib/systemd/user/forskapd.service
        file_info:
          mode: 0644
      - src: forskapd/packaging/forskapd.socket
        dst: /usr/lib/systemd/user/forskapd.socket
        file_info:
          mode: 0644
      - src: forskapd/packaging/config.toml
        dst: /usr/share/forskapd/config.toml
        file_info:
          mode: 0644
      - src: forskap-cli/packaging/gnome-shell/search-providers/org.thehoster.forskap.search-provider.ini
        dst: /usr/share/gnome-shell/search-providers/org.thehoster.forskap.search-provider.ini
        file_info:
          mode: 0644
      - src: forskap-cli/packaging/applications/org.thehoster.forskap.desktop
        dst: /usr/share/applications/org.thehoster.forskap.desktop
        file_info:
          mode: 0644
      - src: forskap-cli/packaging/dbus-1/services/org.thehoster.forskap.SearchProvider.service
        dst: /usr/share/dbus-1/services/org.thehoster.forskap.SearchProvider.service
        file_info:
          mode: 0644
      - src: forskap-cli/packaging/krunner/dbusplugins/org.thehoster.forskap.desktop
        dst: /usr/share/krunner/dbusplugins/org.thehoster.forskap.desktop
        file_info:
          mode: 0644
      - src: forskap-cli/packaging/icons/hicolor/scalable/apps/org.thehoster.forskap.svg
        dst: /usr/share/icons/hicolor/scalable/apps/org.thehoster.forskap.svg
        file_info:
          mode: 0644
      - src: forskap-cli/packaging/icons/hicolor/symbolic/apps/org.thehoster.forskap-symbolic.svg
        dst: /usr/share/icons/hicolor/symbolic/apps/org.thehoster.forskap-symbolic.svg
        file_info:
          mode: 0644
